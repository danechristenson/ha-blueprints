blueprint:
  name: Gradual bedtime fade
  description: "Fades a light from full to off over 10 minutes with pulse reminders. Does nothing if the light is already off, and aborts if it is switched off manually."
  domain: automation
  source_url: https://github.com/danechristenson/ha-blueprints/blob/main/automation/gradual_bedtime_fade.yaml
  input:
    light_entity:
      name: Light(s)
      selector:
        entity:
          domain: light
          multiple: true
    bedtime:
      name: Bedtime
      default: "22:00:00"
      selector:
        time:
    weekdays:
      name: Days
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          multiple: true
          options:
            - { label: Monday, value: mon }
            - { label: Tuesday, value: tue }
            - { label: Wednesday, value: wed }
            - { label: Thursday, value: thu }
            - { label: Friday, value: fri }
            - { label: Saturday, value: sat }
            - { label: Sunday, value: sun }
    pulse_boost:
      name: Pulse size (%)
      description: How far brightness briefly jumps up during a pulse.
      default: 15
      selector:
        number:
          min: 5
          max: 50
          unit_of_measurement: "%"

mode: restart

variables:
  pulse_boost: !input pulse_boost
  weekdays: !input weekdays

triggers:
  - trigger: time
    at: !input bedtime
    id: bedtime
  - trigger: state
    entity_id: !input light_entity
    to: "off"
    id: light_off

conditions: []

actions:
  # Light turned off (or any non-bedtime trigger): restart mode has already
  # cancelled the running fade, and this ends the new run immediately.
  - condition: trigger
    id: bedtime
  - condition: template
    value_template: "{{ now().strftime('%a').lower() in weekdays }}"
  - condition: state
    entity_id: !input light_entity
    state: "on"

  # 0:00 - start at 100%
  - action: light.turn_on
    target:
      entity_id: !input light_entity
    data:
      brightness_pct: 100
      transition: 1
  - delay: 1

  # 0:00 to 5:00 - fade to 50%
  - action: light.turn_on
    target:
      entity_id: !input light_entity
    data:
      brightness_pct: 50
      transition: 299
  - delay: 299

  # 5:00 to 9:00 - each minute: pulse N times, then drop 5% (50 -> 30)
  - repeat:
      for_each: [1, 2, 3, 4]
      sequence:
        - variables:
            minute: "{{ repeat.item }}"
            prev_level: "{{ 55 - repeat.item * 5 }}"
            new_level: "{{ 50 - repeat.item * 5 }}"
        - repeat:
            count: "{{ minute }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: !input light_entity
                data:
                  brightness_pct: "{{ [prev_level + pulse_boost, 100] | min }}"
                  transition: 0.4
              - delay: 0.5
              - action: light.turn_on
                target:
                  entity_id: !input light_entity
                data:
                  brightness_pct: "{{ prev_level }}"
                  transition: 0.4
              - delay: 0.5
        - action: light.turn_on
          target:
            entity_id: !input light_entity
          data:
            brightness_pct: "{{ new_level }}"
            transition: "{{ 60 - minute }}"
        - delay: "{{ 60 - minute }}"

  # 9:00 to 9:50 - fade from 30% down to 10%
  - action: light.turn_on
    target:
      entity_id: !input light_entity
    data:
      brightness_pct: 10
      transition: 50
  - delay: 50

  # 9:50 - final pulse at 10%
  - action: light.turn_on
    target:
      entity_id: !input light_entity
    data:
      brightness_pct: "{{ 10 + pulse_boost }}"
      transition: 0.4
  - delay: 0.5
  - action: light.turn_on
    target:
      entity_id: !input light_entity
    data:
      brightness_pct: 10
      transition: 0.4
  - delay: 0.5

  # 9:51 to 10:00 - down to 1%
  - action: light.turn_on
    target:
      entity_id: !input light_entity
    data:
      brightness_pct: 1
      transition: 9
  - delay: 9

  # 10:00 - off
  - action: light.turn_off
    target:
      entity_id: !input light_entity
    data:
      transition: 0