blueprint:
  name: IKEA dual button -> lights
  description: >-
    Two-button IKEA remote (BILRESA and friends) driving a light or light group.


    All eight button events are used:


    | | press | double press | hold |

    |---|---|---|---|

    | **Top** | toggle, on at your chosen tone | next preset | brighten until
    released |

    | **Bottom** | off | night light | dim until released |


    **Double press on the top button cycles presets**, the way a Hue dimmer
    steps through a room's scenes. The white defaults are Philips' four light
    recipes -- Relax 2237K, Read 2890K, Concentrate 4292K, Energize 6410K --
    which most vendors have copied. There is no equivalent cross-vendor
    standard for colour, so that list is simply a sensible default to edit.


    Cycling is stateless: it reads the light's current setting, finds the
    nearest preset and moves to the next. No counter helper per room, and
    changing the light by any other means leaves the next press still sensible.


    Bottom single press is a plain off rather than a dim step, because holding
    already dims. In the dark that means one button that always turns the light
    off, with no risk of toggling it back on.


    Point it at a **light group** rather than one bulb. Adding a bulb is then a
    change to the group, and a bedside lamp added to the same room later is not
    swept up by the ceiling button.
  domain: automation
  source_url: https://github.com/danechristenson/ha-blueprints/blob/main/automation/ikea_dual_button_light.yaml
  input:
    buttons:
      name: Buttons
      icon: mdi:gesture-tap-button
      collapsed: false
      input:
        top_button:
          name: Top button
          description: The event entity for the upper button.
          selector:
            entity:
              filter:
                - domain: event
        bottom_button:
          name: Bottom button
          description: The event entity for the lower button.
          selector:
            entity:
              filter:
                - domain: event
    target:
      name: Lights
      icon: mdi:lightbulb-group
      collapsed: false
      input:
        lights:
          name: Light or light group
          description: >-
            A single entity, so the preset cycle and the brightness ramp can
            read what the light is currently doing. Use a light group for a room
            with several bulbs.
          selector:
            entity:
              filter:
                - domain: light
        on_kelvin:
          name: Turn-on colour temperature
          description: >-
            The tone a single press on the top button turns the light on at, and
            the tone of the night light. Home Assistant clamps this to what the
            bulb supports, so the default sits below most bulbs' floor and
            therefore lands on the warmest each one can manage. Set it exactly
            if you want a specific tone.
          default: 2000
          selector:
            number: {min: 1500, max: 6500, step: 1, unit_of_measurement: K}
    presets:
      name: Double-press cycle
      icon: mdi:palette
      collapsed: true
      input:
        cycle_mode:
          name: Cycle through
          description: >-
            Colour temperature suits tunable-white bulbs. Choose colour once the
            room has colour-capable bulbs. Auto-detection is not offered because
            white-spectrum bulbs often report a colour mode they cannot really
            use.
          default: color_temp
          selector:
            select:
              options:
                - {value: color_temp, label: Colour temperature}
                - {value: color, label: Colour}
        color_temp_presets:
          name: Colour temperature presets
          description: Kelvin, in cycle order. Defaults are the Hue light recipes.
          default: [2237, 2890, 4292, 6410]
          selector:
            object:
        color_presets:
          name: Colour presets
          description: >-
            Hue and saturation pairs, in cycle order. Only used when cycling
            colour.
          default: [[30, 90], [120, 70], [210, 80], [285, 70]]
          selector:
            object:
    tuning:
      name: Tuning
      icon: mdi:tune
      collapsed: true
      input:
        ramp_step:
          name: Ramp step
          description: >-
            Brightness change per tick while a button is held. Larger is faster
            and coarser.
          default: 8
          selector:
            number: {min: 1, max: 25, step: 1, unit_of_measurement: "%"}
        ramp_interval:
          name: Ramp interval
          description: Milliseconds between ticks while held.
          default: 300
          selector:
            number: {min: 100, max: 1000, step: 50, unit_of_measurement: ms}
        night_brightness:
          name: Night light brightness
          default: 1
          selector:
            number: {min: 1, max: 30, step: 1, unit_of_measurement: "%"}
        off_fade:
          name: Fade-off seconds
          description: How long the bottom button's single press takes to go dark.
          default: 2
          selector:
            number: {min: 0, max: 10, step: 1, unit_of_measurement: s}

# A held button has to be interruptible by its own release. Restart means the
# release event re-enters the automation, which abandons the running ramp loop.
# Without it the loop would hold the single run and the release would be
# dropped, leaving the light ramping to its limit every time.
mode: restart

variables:
  light_entity: !input lights
  cycle_mode: !input cycle_mode
  ct_presets: !input color_temp_presets
  color_presets: !input color_presets
  ramp_step: !input ramp_step
  # Nearest-preset-then-advance. Starting from the light's real setting means a
  # change made from the app or a dashboard does not desynchronise the cycle.
  next_ct: >-
    {% set cur = state_attr(light_entity, 'color_temp_kelvin') | int(0) %}
    {% if cur == 0 or ct_presets | count == 0 %}
      {{ ct_presets[0] | default(2700) }}
    {% else %}
      {% set ns = namespace(best=0, dist=99999999) %}
      {% for i in range(ct_presets | count) %}
        {% set d = ((ct_presets[i] | int) - cur) | abs %}
        {% if d < ns.dist %}{% set ns.dist = d %}{% set ns.best = i %}{% endif %}
      {% endfor %}
      {{ ct_presets[(ns.best + 1) % (ct_presets | count)] }}
    {% endif %}
  next_color: >-
    {% set cur = state_attr(light_entity, 'hs_color') %}
    {% if cur is none or color_presets | count == 0 %}
      {{ color_presets[0] | default([30, 90]) }}
    {% else %}
      {% set ns = namespace(best=0, dist=99999999) %}
      {% for i in range(color_presets | count) %}
        {% set dh = ((color_presets[i][0] | float) - (cur[0] | float)) | abs %}
        {% set dh = [dh, 360 - dh] | min %}
        {% if dh < ns.dist %}{% set ns.dist = dh %}{% set ns.best = i %}{% endif %}
      {% endfor %}
      {{ color_presets[(ns.best + 1) % (color_presets | count)] }}
    {% endif %}

triggers:
  - trigger: event.received
    id: top
    target:
      entity_id: !input top_button
    options:
      event_type: [multi_press_1]
  - trigger: event.received
    id: top_double
    target:
      entity_id: !input top_button
    options:
      event_type: [multi_press_2]
  - trigger: event.received
    id: top_hold
    target:
      entity_id: !input top_button
    options:
      event_type: [long_press]
  - trigger: event.received
    id: released
    target:
      entity_id: !input top_button
    options:
      event_type: [long_release]
  - trigger: event.received
    id: bottom
    target:
      entity_id: !input bottom_button
    options:
      event_type: [multi_press_1]
  - trigger: event.received
    id: bottom_double
    target:
      entity_id: !input bottom_button
    options:
      event_type: [multi_press_2]
  - trigger: event.received
    id: bottom_hold
    target:
      entity_id: !input bottom_button
    options:
      event_type: [long_press]
  - trigger: event.received
    id: released
    target:
      entity_id: !input bottom_button
    options:
      event_type: [long_release]

conditions: []

actions:
  - choose:
      # Release does nothing on its own. Its value is the restart it causes,
      # which is what stops a ramp. Listed first so it resolves immediately.
      - conditions:
          - condition: trigger
            id: released
        sequence:
          - stop: button released

      - conditions:
          - condition: trigger
            id: top
        sequence:
          - action: light.toggle
            target:
              entity_id: !input lights
            data:
              transition: 0
              color_temp_kelvin: !input on_kelvin
              brightness_pct: 100

      - conditions:
          - condition: trigger
            id: top_double
        sequence:
          - choose:
              - conditions:
                  - "{{ cycle_mode == 'color' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input lights
                    data:
                      transition: 1
                      hs_color: "{{ next_color }}"
            default:
              - action: light.turn_on
                target:
                  entity_id: !input lights
                data:
                  transition: 1
                  color_temp_kelvin: "{{ next_ct }}"

      - conditions:
          - condition: trigger
            id: top_hold
        sequence:
          # The step count is bounded as well as limit-checked: if the release
          # event is lost the ramp still stops rather than running to no end.
          - repeat:
              while:
                - condition: template
                  value_template: "{{ repeat.index <= 40 }}"
                - condition: template
                  value_template: >-
                    {{ (state_attr(light_entity, 'brightness') | int(0)) < 254 }}
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input lights
                  data:
                    brightness_step_pct: !input ramp_step
                    transition: 0
                - delay:
                    milliseconds: !input ramp_interval

      - conditions:
          - condition: trigger
            id: bottom
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input lights
            data:
              transition: !input off_fade

      - conditions:
          - condition: trigger
            id: bottom_double
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input lights
            data:
              transition: 1
              color_temp_kelvin: !input on_kelvin
              brightness_pct: !input night_brightness

      - conditions:
          - condition: trigger
            id: bottom_hold
          # Nothing to dim if it is already off, and a step from off would
          # switch it on.
          - condition: state
            entity_id: !input lights
            state: "on"
        sequence:
          # Stops at the dimmest the bulb will hold rather than switching off,
          # so holding too long never loses the light.
          - repeat:
              while:
                - condition: template
                  value_template: "{{ repeat.index <= 40 }}"
                - condition: template
                  value_template: >-
                    {{ (state_attr(light_entity, 'brightness') | int(255)) > 5 }}
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input lights
                  data:
                    brightness_step_pct: "{{ 0 - (ramp_step | int) }}"
                    transition: 0
                - delay:
                    milliseconds: !input ramp_interval
